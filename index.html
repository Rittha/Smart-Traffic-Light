<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bang Bo 3-Way Smart Traffic (AI Efficiency Mode)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0d0f; --card: #16191c; --primary: #007aff; --danger: #ff3b30; --success: #34c759; --warning: #ffcc00; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #e1e1e1; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; }
        
        #emergencyBox { 
            background: var(--danger); color: white; padding: 15px; border-radius: 15px; 
            margin-bottom: 15px; display: none; text-align: center; font-weight: bold;
            animation: blink 0.6s infinite; border: 2px solid white; box-shadow: 0 0 20px var(--danger);
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .junction-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .light-card { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid #2d3136; text-align: center; transition: 0.3s; }
        .light-card.active-lane { border: 2px solid var(--success); box-shadow: 0 0 15px rgba(52, 199, 89, 0.2); }
        .lane-label { font-size: 12px; font-weight: bold; color: var(--primary); margin-bottom: 10px; display: block; }
        
        .light-box { background: #000; width: 40px; padding: 12px; border-radius: 30px; margin: 10px auto; display: flex; flex-direction: column; gap: 10px; border: 2px solid #333; }
        .bulb { width: 35px; height: 35px; border-radius: 50%; background: #222; transition: 0.3s; }
        .red.active { background: var(--danger); box-shadow: 0 0 20px var(--danger); }
        .yellow.active { background: var(--warning); box-shadow: 0 0 20px var(--warning); }
        .green.active { background: var(--success); box-shadow: 0 0 20px var(--success); }

        .timer-small { font-size: 32px; font-weight: 700; margin: 5px 0; }
        .index-box { background: #25292e; padding: 5px; border-radius: 10px; font-size: 12px; margin-top: 10px; }
        .status-msg { font-size: 10px; height: 15px; color: var(--warning); margin-top: 5px; }

        .control-panel { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #2d3136; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Kanit'; margin-bottom: 8px; color: white; }
        .btn-main { background: var(--primary); }
        .btn-emergency { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
        
        @media (max-width: 600px) { .junction-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div id="emergencyBox">🚨 EMERGENCY PRIORITY: CLEARING ALL LANES 🚨</div>

    <header style="text-align: center; margin-bottom: 15px;">
        <h2 style="margin:0;">BANG BO SMART JUNCTION</h2>
        <small style="color:#888;">ระบบควบคุม 3 แยกอัจฉริยะ (ประสิทธิภาพสูงสุด)</small>
    </header>

    <div class="junction-grid">
        <div id="laneA" class="light-card">
            <span class="lane-label">A: จากบางนา-ตราด</span>
            <div class="light-box">
                <div id="l-red-A" class="bulb red active"></div>
                <div id="l-yellow-A" class="bulb yellow"></div>
                <div id="l-green-A" class="bulb green"></div>
            </div>
            <div id="timerA" class="timer-small">--</div>
            <div class="index-box">Index: <span id="idxA">1.00</span>x</div>
            <div id="msgA" class="status-msg"></div>
        </div>

        <div id="laneB" class="light-card">
            <span class="lane-label">B: จากตลาดบางบ่อ</span>
            <div class="light-box">
                <div id="l-red-B" class="bulb red active"></div>
                <div id="l-yellow-B" class="bulb yellow"></div>
                <div id="l-green-B" class="bulb green"></div>
            </div>
            <div id="timerB" class="timer-small">--</div>
            <div class="index-box">Index: <span id="idxB">1.00</span>x</div>
            <div id="msgB" class="status-msg"></div>
        </div>

        <div id="laneC" class="light-card">
            <span class="lane-label">C: ออกจากซอย รร.</span>
            <div class="light-box">
                <div id="l-red-C" class="bulb red active"></div>
                <div id="l-yellow-C" class="bulb yellow"></div>
                <div id="l-green-C" class="bulb green"></div>
            </div>
            <div id="timerC" class="timer-small">--</div>
            <div class="index-box">Index: <span id="idxC">1.00</span>x</div>
            <div id="msgC" class="status-msg"></div>
        </div>
    </div>

    <div class="control-panel">
        <button id="modeToggle" class="btn-main">สลับเป็นโหมดควบคุมมือ (Manual)</button>
        <button class="btn-emergency" onclick="triggerEmergency()">🚨 จำลองรถฉุกเฉิน</button>
        <div id="manualUI" style="display:none; margin-top:10px;">
            <button class="btn-main" style="background:#444;" onclick="forceNextPhase()">ข้ามไปเลนถัดไป</button>
        </div>
    </div>
</div>

<script>
    let isAuto = true;
    let isEmergency = false;
    let currentPhase = 0; 
    let timeLeft = 30;
    let trafficIndexes = { A: 1.0, B: 1.0, C: 1.0 };

    // --- Core System Loop ---
    setInterval(() => {
        if (isEmergency) return;

        if (isAuto) {
            timeLeft--;

            // CHECK: ถ้าเลนปัจจุบัน "ไม่มีรถ" (Index ต่ำกว่า 1.05) ให้บีบเวลาลงมาเหลือ 10 วิ
            const lanes = ['A', 'B', 'C'];
            const currentLane = lanes[currentPhase];
            const currentIdx = parseFloat(trafficIndexes[currentLane]);
            const msgEl = document.getElementById(`msg${currentLane}`);

            if (currentIdx <= 1.05 && timeLeft > 10) {
                timeLeft = 10;
                msgEl.innerText = "ถนนว่าง: ลดเวลาอัตโนมัติ";
            } else if (currentIdx > 1.05) {
                msgEl.innerText = "";
            }

            if (timeLeft <= 0) {
                nextPhase();
            }
        }
        updateDisplay();
        simulateTrafficUpdate(); // จำลองค่า API
    }, 1000);

    function nextPhase() {
        // วนจาก A -> B -> C
        currentPhase = (currentPhase + 1) % 3;
        const lanes = ['A', 'B', 'C'];
        const nextLane = lanes[currentPhase];
        const nextIdx = parseFloat(trafficIndexes[nextLane]);

        // ตั้งเวลาตั้งต้น: ถ้าไม่มีรถให้แค่ 10 วิ ถ้ามีรถให้ตามสัดส่วน Index
        if (nextIdx <= 1.05) {
            timeLeft = 10;
        } else {
            timeLeft = Math.round(30 * nextIdx); // สูงสุดประมาณ 45-60 วิ
        }
        
        // ล้างข้อความเลนเก่า
        ['A', 'B', 'C'].forEach(l => document.getElementById(`msg${l}`).innerText = "");
    }

    function forceNextPhase() { timeLeft = 0; nextPhase(); }

    function updateDisplay() {
        const lanes = ['A', 'B', 'C'];
        lanes.forEach((lane, index) => {
            const card = document.getElementById(`lane${lane}`);
            const timer = document.getElementById(`timer${lane}`);
            
            document.getElementById(`l-red-${lane}`).classList.remove('active');
            document.getElementById(`l-yellow-${lane}`).classList.remove('active');
            document.getElementById(`l-green-${lane}`).classList.remove('active');
            card.classList.remove('active-lane');

            if (index === currentPhase) {
                card.classList.add('active-lane');
                if (timeLeft > 5) {
                    document.getElementById(`l-green-${lane}`).classList.add('active');
                    timer.style.color = 'var(--success)';
                } else {
                    document.getElementById(`l-yellow-${lane}`).classList.add('active');
                    timer.style.color = 'var(--warning)';
                }
                timer.innerText = timeLeft + "s";
            } else {
                document.getElementById(`l-red-${lane}`).classList.add('active');
                timer.innerText = "--";
                timer.style.color = "#444";
            }
        });

        document.getElementById('idxA').innerText = trafficIndexes.A;
        document.getElementById('idxB').innerText = trafficIndexes.B;
        document.getElementById('idxC').innerText = trafficIndexes.C;
    }

    function simulateTrafficUpdate() {
        // สุ่มค่าเลียนแบบ API (ในงานจริงให้ดึงจาก Google Distance Matrix แยกจุด)
        if (timeLeft % 3 === 0) {
            ['A', 'B', 'C'].forEach(l => {
                // สุ่มให้มีโอกาสรถว่าง (1.00) หรือรถติด (สูงสุด 2.00)
                let rand = (Math.random() > 0.7) ? 1.00 : (1 + Math.random() * 0.8).toFixed(2);
                trafficIndexes[l] = rand;
            });
        }
    }

    document.getElementById('modeToggle').onclick = () => {
        isAuto = !isAuto;
        document.getElementById('manualUI').style.display = isAuto ? "none" : "block";
        document.getElementById('modeToggle').innerText = isAuto ? "สลับเป็นโหมดควบคุมมือ (Manual)" : "กลับสู่ระบบอัตโนมัติ";
    };

    function triggerEmergency() {
        if (isEmergency) return;
        isEmergency = true;
        document.getElementById('emergencyBox').style.display = 'block';
        timeLeft = 99; // ค้างไว้จนกว่าจะพ้นช่วงกู้ภัย
        updateDisplay();
        setTimeout(() => {
            isEmergency = false;
            document.getElementById('emergencyBox').style.display = 'none';
            timeLeft = 5; // เตรียมเปลี่ยนเลนหลังจบเหตุการณ์
        }, 7000);
    }
</script>
</body>
</html>
