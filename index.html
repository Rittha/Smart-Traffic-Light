<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bang Bo Smart Junction (Real-Map Sync)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0d0f; --card: #16191c; --primary: #007aff; --danger: #ff3b30; --success: #34c759; --warning: #ffcc00; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #e1e1e1; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; }
        
        #emergencyBox { 
            background: var(--danger); color: white; padding: 15px; border-radius: 15px; 
            margin-bottom: 15px; display: none; text-align: center; font-weight: bold;
            animation: blink 0.6s infinite; border: 2px solid white; box-shadow: 0 0 20px var(--danger);
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .junction-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .light-card { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid #2d3136; text-align: center; transition: 0.3s; }
        .light-card.active-lane { border: 2px solid var(--success); box-shadow: 0 0 15px rgba(52, 199, 89, 0.2); }
        .lane-label { font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: 10px; display: block; height: 50px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        
        .light-box { background: #000; width: 45px; padding: 15px; border-radius: 35px; margin: 10px auto; display: flex; flex-direction: column; gap: 12px; border: 2px solid #333; }
        .bulb { width: 40px; height: 40px; border-radius: 50%; background: #222; transition: 0.3s; }
        .red.active { background: var(--danger); box-shadow: 0 0 20px var(--danger); }
        .yellow.active { background: var(--warning); box-shadow: 0 0 20px var(--warning); }
        .green.active { background: var(--success); box-shadow: 0 0 20px var(--success); }

        .timer-small { font-size: 36px; font-weight: 700; margin: 5px 0; font-variant-numeric: tabular-nums; }
        .index-box { background: #25292e; padding: 6px; border-radius: 10px; font-size: 13px; margin-top: 10px; border: 1px solid #333; }
        .status-msg { font-size: 11px; height: 18px; color: var(--warning); margin-top: 5px; font-weight: 300; }

        .control-panel { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #2d3136; margin-bottom: 15px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Kanit'; margin-bottom: 8px; color: white; font-size: 15px; }
        .btn-main { background: var(--primary); }
        .btn-emergency { background: transparent; color: var(--danger); border: 2px solid var(--danger); }
        
        @media (max-width: 650px) { .junction-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div id="emergencyBox">🚨 EMERGENCY PRIORITY: CLEARING ALL LANES 🚨</div>

    <header style="text-align: center; margin-bottom: 20px; margin-top: 10px;">
        <h2 style="margin:0; color: white;">BANG BO SMART JUNCTION</h2>
        <small style="color:#888;">พิกัด: สามแยกหน้าโรงเรียนชุมชนบางบ่อ</small>
    </header>

    <div class="junction-grid">
        <div id="laneA" class="light-card">
            <span class="lane-label">A: จากบางพลี<br>(เทพารักษ์)</span>
            <div class="light-box">
                <div id="l-red-A" class="bulb red active"></div>
                <div id="l-yellow-A" class="bulb yellow"></div>
                <div id="l-green-A" class="bulb green"></div>
            </div>
            <div id="timerA" class="timer-small">--</div>
            <div class="index-box">Traffic: <span id="idxA">1.00</span>x</div>
            <div id="msgA" class="status-msg"></div>
        </div>

        <div id="laneB" class="light-card">
            <span class="lane-label">B: จากตลาดบางบ่อ<br>(ขาออก)</span>
            <div class="light-box">
                <div id="l-red-B" class="bulb red active"></div>
                <div id="l-yellow-B" class="bulb yellow"></div>
                <div id="l-green-B" class="bulb green"></div>
            </div>
            <div id="timerB" class="timer-small">--</div>
            <div class="index-box">Traffic: <span id="idxB">1.00</span>x</div>
            <div id="msgB" class="status-msg"></div>
        </div>

        <div id="laneC" class="light-card">
            <span class="lane-label">C: จากคลองด่าน<br>(ขาเข้า)</span>
            <div class="light-box">
                <div id="l-red-C" class="bulb red active"></div>
                <div id="l-yellow-C" class="bulb yellow"></div>
                <div id="l-green-C" class="bulb green"></div>
            </div>
            <div id="timerC" class="timer-small">--</div>
            <div class="index-box">Traffic: <span id="idxC">1.00</span>x</div>
            <div id="msgC" class="status-msg"></div>
        </div>
    </div>

    <div class="control-panel">
        <button id="modeToggle" class="btn-main">สลับเป็นโหมดควบคุมมือ (Manual)</button>
        <button class="btn-emergency" onclick="triggerEmergency()">🚨 จำลองรถฉุกเฉิน</button>
        <div id="manualUI" style="display:none; margin-top:12px; border-top: 1px solid #333; padding-top: 15px;">
            <button class="btn-main" style="background:#444;" onclick="forceNextPhase()">ปล่อยเลนถัดไป</button>
        </div>
    </div>
</div>

<script>
    let isAuto = true;
    let isEmergency = false;
    let currentPhase = 0; // 0:บางพลี, 1:ตลาดบางบ่อ, 2:คลองด่าน
    let timeLeft = 30;
    let trafficIndexes = { A: 1.0, B: 1.0, C: 1.0 };

    setInterval(() => {
        if (isEmergency) return;
        if (isAuto) {
            timeLeft--;
            const lanes = ['A', 'B', 'C'];
            const currentLane = lanes[currentPhase];
            const currentIdx = parseFloat(trafficIndexes[currentLane]);

            // AI Efficiency Logic: ถนนว่างลดเวลาเหลือ 10 วิ
            if (currentIdx <= 1.05 && timeLeft > 10) {
                timeLeft = 10;
                document.getElementById(`msg${currentLane}`).innerText = "ถนนว่าง: AI เร่งไฟ";
            } else if (currentIdx > 1.05) {
                document.getElementById(`msg${currentLane}`).innerText = "";
            }

            if (timeLeft <= 0) nextPhase();
        }
        updateDisplay();
        simulateTrafficUpdate(); 
    }, 1000);

    function nextPhase() {
        currentPhase = (currentPhase + 1) % 3;
        const lanes = ['A', 'B', 'C'];
        const nextIdx = parseFloat(trafficIndexes[lanes[currentPhase]]);
        timeLeft = (nextIdx <= 1.05) ? 10 : Math.round(30 * nextIdx);
        lanes.forEach(l => document.getElementById(`msg${l}`).innerText = "");
    }

    function forceNextPhase() { timeLeft = 0; nextPhase(); }

    function updateDisplay() {
        ['A', 'B', 'C'].forEach((lane, index) => {
            const card = document.getElementById(`lane${lane}`);
            const timer = document.getElementById(`timer${lane}`);
            document.getElementById(`l-red-${lane}`).classList.toggle('active', index !== currentPhase);
            document.getElementById(`l-yellow-${lane}`).classList.toggle('active', index === currentPhase && timeLeft <= 5);
            document.getElementById(`l-green-${lane}`).classList.toggle('active', index === currentPhase && timeLeft > 5);
            card.classList.toggle('active-lane', index === currentPhase);
            timer.innerText = (index === currentPhase) ? timeLeft + "s" : "--";
            timer.style.color = (index === currentPhase) ? (timeLeft > 5 ? 'var(--success)' : 'var(--warning)') : "#444";
        });
        document.getElementById('idxA').innerText = trafficIndexes.A;
        document.getElementById('idxB').innerText = trafficIndexes.B;
        document.getElementById('idxC').innerText = trafficIndexes.C;
    }

    function simulateTrafficUpdate() {
        if (timeLeft % 4 === 0) {
            ['A', 'B', 'C'].forEach(l => {
                trafficIndexes[l] = (Math.random() > 0.6) ? 1.00 : (1 + Math.random() * 0.9).toFixed(2);
            });
        }
    }

    document.getElementById('modeToggle').onclick = () => {
        isAuto = !isAuto;
        document.getElementById('manualUI').style.display = isAuto ? "none" : "block";
        document.getElementById('modeToggle').innerText = isAuto ? "สลับเป็นโหมดควบคุมมือ (Manual)" : "กลับสู่โหมดอัตโนมัติ";
    };

    function triggerEmergency() {
        if (isEmergency) return;
        isEmergency = true;
        document.getElementById('emergencyBox').style.display = 'block';
        timeLeft = 99;
        updateDisplay();
        setTimeout(() => {
            isEmergency = false;
            document.getElementById('emergencyBox').style.display = 'none';
            timeLeft = 5;
        }, 8000);
    }
</script>
</body>
</html>
